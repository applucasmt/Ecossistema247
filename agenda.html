<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Agenda Parlamentar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: #1a3a7a;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .controles {
      background: white;
      padding: 24px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 30px;
    }

    .grupo {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 0 140px;
    }

    .grupo label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .grupo input {
      padding: 8px 12px;
      border: 1.5px solid #d0d7de;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .grupo input:focus {
      border-color: #1a3a7a;
      outline: none;
    }

    .grupo input[type="number"] {
      max-width: 80px;
    }

    .controles button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      background: #1a3a7a;
      color: white;
    }

    .controles button:hover {
      background: #2a5a9a;
      transform: translateY(-1px);
    }

    .controles button:last-child {
      background: #2d8a4e;
    }

    .controles button:last-child:hover {
      background: #3a9a5e;
    }

    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .item-agenda {
      background: white;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .item-agenda:hover {
      transform: scale(1.02);
    }

    .item-agenda svg {
      width: 100%;
      height: auto;
      max-width: 320px;
      display: block;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .controles {
        flex-direction: column;
        align-items: stretch;
      }
      .grupo {
        flex: 1 1 auto;
      }
      .controles button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Gerador de Agenda Parlamentar</h1>
    
    <div class="controles">
      <div class="grupo">
        <label>Nome do Deputado:</label>
        <input type="text" id="nome" value="Dr. João Silva" placeholder="Nome completo">
      </div>
      <div class="grupo">
        <label>Partido:</label>
        <input type="text" id="partido" value="PDT" placeholder="Partido">
      </div>
      <div class="grupo">
        <label>UF:</label>
        <input type="text" id="uf" value="SP" placeholder="UF" maxlength="2">
      </div>
      <div class="grupo">
        <label>Data Inicial:</label>
        <input type="date" id="dataInicial" value="2026-09-01">
      </div>
      <div class="grupo">
        <label>Local:</label>
        <input type="text" id="localBase" value="Câmara Municipal" placeholder="Local">
      </div>
      <div class="grupo">
        <label>Evento:</label>
        <input type="text" id="eventoBase" value="Reunião com lideranças" placeholder="Evento">
      </div>
      <div class="grupo">
        <label>Quantidade de dias:</label>
        <input type="number" id="qtdeDias" value="3" min="1" max="20">
      </div>
      <button onclick="gerarAgenda()">🔄 Gerar Agenda</button>
      <button onclick="baixarSVG()">⬇ Baixar SVG</button>
    </div>

    <div id="preview"></div>
  </div>

  <script>
    // ===== TEMPLATE SVG BASE =====
    const TEMPLATE_SVG = `
    <svg xmlns="http://www.w3.org/2000/svg" width="4084.35" height="7261.07" viewBox="0 0 4084.35 7261.07">
      <!-- Fundo -->
      <rect width="4084.35" height="7261.07" fill="#f5f0e8" rx="20"/>
      <rect x="20" y="20" width="4044.35" height="7221.07" fill="none" stroke="#1a3a7a" stroke-width="8" rx="12"/>
      
      <!-- Cabeçalho -->
      <rect x="40" y="40" width="4004.35" height="600" fill="#1a3a7a" rx="8"/>
      <text x="2042" y="180" text-anchor="middle" font-size="80" font-weight="bold" fill="white">AGENDA PARLAMENTAR</text>
      <text x="2042" y="300" text-anchor="middle" font-size="40" fill="#aaccee">Compromissos do Gabinete</text>
      
      <!-- Linha decorativa -->
      <line x1="200" y1="370" x2="3884" y2="370" stroke="#aaccee" stroke-width="2"/>
      
      <!-- Nome do Deputado -->
      <rect x="40" y="420" width="4004.35" height="160" fill="#e8edf5" rx="8"/>
      <text x="2042" y="530" text-anchor="middle" font-size="72" font-weight="bold" fill="#1a3a7a">{{NOME}}</text>
      
      <!-- Partido / UF -->
      <rect x="40" y="600" width="4004.35" height="100" fill="#d0d8e8" rx="8"/>
      <text x="2042" y="670" text-anchor="middle" font-size="44" font-weight="bold" fill="#1a3a7a">{{PARTIDO}} - {{UF}}</text>

      <!-- Área do Conteúdo -->
      <rect x="40" y="740" width="4004.35" height="6200" fill="white" rx="8"/>
      
      <!-- Título da seção -->
      <text x="2042" y="850" text-anchor="middle" font-size="56" font-weight="bold" fill="#1a3a7a">📋 COMPROMISSO DO DIA</text>
      <line x1="400" y1="880" x2="3684" y2="880" stroke="#1a3a7a" stroke-width="3"/>
      
      <!-- DATA -->
      <rect x="80" y="920" width="3924.35" height="160" fill="#f0f4ff" rx="12" stroke="#1a3a7a" stroke-width="2"/>
      <text x="140" y="1030" font-size="52" font-weight="bold" fill="#1a3a7a">📅 DATA:</text>
      <text x="420" y="1030" font-size="52" fill="#222">{{DATA}}</text>

      <!-- LOCAL -->
      <rect x="80" y="1120" width="3924.35" height="160" fill="#fafcff" rx="12" stroke="#1a3a7a" stroke-width="2"/>
      <text x="140" y="1230" font-size="52" font-weight="bold" fill="#1a3a7a">📍 LOCAL:</text>
      <text x="520" y="1230" font-size="52" fill="#222">{{LOCAL}}</text>

      <!-- EVENTO -->
      <rect x="80" y="1320" width="3924.35" height="160" fill="#f0f4ff" rx="12" stroke="#1a3a7a" stroke-width="2"/>
      <text x="140" y="1430" font-size="52" font-weight="bold" fill="#1a3a7a">📌 EVENTO:</text>
      <text x="580" y="1430" font-size="52" fill="#222">{{EVENTO}}</text>

      <!-- Observações -->
      <rect x="80" y="1520" width="3924.35" height="120" fill="#fafcff" rx="12" stroke="#1a3a7a" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="140" y="1590" font-size="40" fill="#666">Observações: _________________________</text>

      <!-- Rodapé -->
      <rect x="40" y="7000" width="4004.35" height="220" fill="#1a3a7a" rx="8"/>
      <text x="2042" y="7080" text-anchor="middle" font-size="40" fill="white">📞 Gabinete do Deputado - (11) 9999-9999</text>
      <text x="2042" y="7160" text-anchor="middle" font-size="32" fill="#aaccee">contato@deputado.com.br | @deputado_oficial</text>
    </svg>`;

    // ===== FUNÇÃO GERAR AGENDA =====
    function gerarAgenda() {
      const nome = document.getElementById('nome').value || 'Deputado';
      const partido = document.getElementById('partido').value || 'PARTIDO';
      const uf = document.getElementById('uf').value || 'UF';
      const dataInicial = new Date(document.getElementById('dataInicial').value || '2026-09-01');
      const localBase = document.getElementById('localBase').value || 'Câmara Municipal';
      const eventoBase = document.getElementById('eventoBase').value || 'Reunião';
      const qtde = parseInt(document.getElementById('qtdeDias').value) || 1;

      const preview = document.getElementById('preview');
      preview.innerHTML = '';

      for (let i = 0; i < qtde; i++) {
        // Calcula a data
        const dataAtual = new Date(dataInicial);
        dataAtual.setDate(dataAtual.getDate() + i);
        
        // Dias da semana em português
        const diasSemana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
        const diaSemana = diasSemana[dataAtual.getDay()];
        
        const dataFormatada = `${diaSemana}, ${dataAtual.toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        })}`;

        const local = `${localBase} - Sala ${i+1}`;
        const evento = `${eventoBase} - Pauta ${i+1}`;

        let svg = TEMPLATE_SVG
          .replace(/{{NOME}}/g, nome.toUpperCase())
          .replace(/{{PARTIDO}}/g, partido.toUpperCase())
          .replace(/{{UF}}/g, uf.toUpperCase())
          .replace(/{{DATA}}/g, dataFormatada)
          .replace(/{{LOCAL}}/g, local)
          .replace(/{{EVENTO}}/g, evento);

        // Cria o card
        const div = document.createElement('div');
        div.className = 'item-agenda';
        div.innerHTML = svg;
        preview.appendChild(div);
      }
    }

    // ===== FUNÇÃO BAIXAR SVG =====
    function baixarSVG() {
      const items = document.querySelectorAll('.item-agenda');
      if (!items.length) {
        alert('Gere a agenda primeiro!');
        return;
      }

      // Pega todos os SVGs e junta em um só
      let svgCompleto = `<svg xmlns="http://www.w3.org/2000/svg" width="${4084.35 * items.length}" height="7261.07" viewBox="0 0 ${4084.35 * items.length} 7261.07">`;
      items.forEach((el, idx) => {
        const svgContent = el.querySelector('svg').innerHTML;
        svgCompleto += `<g transform="translate(${idx * 4084.35}, 0)">${svgContent}</g>`;
      });
      svgCompleto += '</svg>';

      // Cria link para download
      const blob = new Blob([svgCompleto], { type: 'image/svg+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `agenda_deputado_${new Date().toISOString().slice(0,10)}.svg`;
      link.click();
    }

    // ===== GERA AUTOMATICAMENTE AO CARREGAR =====
    window.onload = gerarAgenda;
  </script>
</body>
</html>
