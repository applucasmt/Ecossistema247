<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GABINETE 247</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="ferramentas.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --sidebar-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #007aff; /* Tom de azul otimizado para interfaces de app */
            --accent-hover: rgba(0, 122, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Top Header para Mobile (Escondido no Desktop) */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: center;
            height: env(safe-area-inset-top, 60px);
            padding-top: env(safe-area-inset-top);
            min-height: 60px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            z-index: 20;
            position: fixed;
            top: 0;
            width: 100%;
        }
        .mobile-header i { color: var(--accent); margin-right: 8px; }

        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
            z-index: 20;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2.5rem;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand i { color: var(--accent); font-size: 1.4rem; }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .nav-item i {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.2s ease;
            width: 24px;
            text-align: center;
        }

        .nav-item:hover { background-color: rgba(0,0,0,0.03); }
        .nav-item.active { background-color: var(--accent-hover); color: var(--accent); }
        .nav-item.active i { color: var(--accent); }

        .content-area {
            flex: 1;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-color);
        }

        /* RESPONSIVO: MOBILE APP EXPERIENCE */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            
            .mobile-header { display: flex; }
            .brand { display: none; }

            /* Transforma o menu lateral em uma Bottom Navigation Bar (App Nativo) */
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: calc(65px + env(safe-area-inset-bottom));
                padding: 0;
                padding-bottom: env(safe-area-inset-bottom); /* Respeita a barra de gestos dos celulares modernos */
                border-right: none;
                border-top: 1px solid rgba(0,0,0,0.1);
                flex-direction: row;
                align-items: center;
                justify-content: center;
                box-shadow: 0 -5px 15px rgba(0,0,0,0.03);
            }

            nav { width: 100%; height: 100%; }

            .nav-menu {
                flex-direction: row;
                height: 100%;
                justify-content: space-around;
                align-items: center;
                padding: 0 5px;
            }

            .nav-item {
                flex-direction: column;
                gap: 4px;
                padding: 6px 2px;
                border-radius: 0;
                justify-content: center;
                font-size: 0.65rem;
                width: auto;
                flex: 1;
                background: transparent !important;
                color: var(--text-muted);
            }

            .nav-item.active { color: var(--accent); }
            .nav-item.active i { color: var(--accent); }
            
            .nav-item span {
                display: block;
                font-size: 0.65rem;
                font-weight: 500;
                text-align: center;
            }

            .nav-item i {
                font-size: 1.4rem;
                margin-bottom: 2px;
            }

            .content-area {
                margin-top: max(60px, env(safe-area-inset-top));
                height: calc(100dvh - max(60px, env(safe-area-inset-top)) - 65px - env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <i class="fas fa-layer-group"></i> GABINETE 247
    </div>

    <aside class="sidebar">
        <div class="brand">
            <i class="fas fa-layer-group"></i>
            GABINETE 247
        </div>
        <nav>
            <ul class="nav-menu" id="menu-dinamico"></ul>
        </nav>
    </aside>

    <main class="content-area">
        <iframe name="app-frame" id="main-frame" src="inicio.html" title="Aplicativo GABINETE 247"></iframe>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuContainer = document.getElementById('menu-dinamico');

            ferramentasGabinete.forEach(ferramenta => {
                const li = document.createElement('li');
                const isAtivo = ferramenta.id === 'inicio' ? 'active' : '';
                
                li.innerHTML = `
                    <a href="${ferramenta.arquivo}" target="app-frame" class="nav-item ${isAtivo}" data-id="${ferramenta.id}">
                        <i class="${ferramenta.icone}"></i>
                        <span>${ferramenta.nome}</span>
                    </a>
                `;
                menuContainer.appendChild(li);
            });

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
